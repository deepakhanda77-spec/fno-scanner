   name: Daily F&O Scan

   on:
     schedule:
       - cron: "30 10 * * 1-5"   # 4:00 PM IST, Mon-Fri
     workflow_dispatch:            # lets you run it manually

   permissions:
     contents: write

   jobs:
     scan:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.11"
         - run: pip install -r requirements.txt
         - run: python fno_pullback_scanner.py
        - name: Save results to repo
           run: |
             if [ -f scan_results.csv ]; then
               git config user.name "github-actions"
               git config user.email "actions@github.com"
               git add scan_results.csv
               git commit -m "Scan $(date -u +%F)" || echo "No changes"
               git push
             else
               echo "No scan_results.csv today - no candidates."
             fi
